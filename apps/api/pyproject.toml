[project]
name = "online-classroom-api"
version = "0.1.0"
description = "FastAPI service for an online teaching platform serving Chinese learners globally."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "email-validator>=2.2.0",
  "google-auth[requests]>=2.30.0",
  "python-multipart>=0.0.9",
  "passlib>=1.7.4",
  "redis>=5.0.7",
  "stripe>=11.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
